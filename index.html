<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAEVIKUDILEMMAD ONLINE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="bg-home" class="global-bg active"></div>
    <div id="bg-game" class="global-bg"></div>
    <div id="bg-final" class="global-bg"></div>
    <div class="crt-overlay"></div>

    <section id="home-screen">
        <div class="home-ui">
            <div class="top-secret-bar">CLASSIFIED // ONLINE MODE</div>
            <h1>KAEVIKU<br>DILEMMAD</h1>
            <div id="setup-area">
                <input type="text" id="player-name" placeholder="IDENTIFITSEERI SÕDUR..." maxlength="12">
                <div style="margin-top:20px; display: flex; gap: 10px; justify-content: center;">
                    <button onclick="hostGame()" class="nav-toggle">TEE UUS MÄNG</button>
                    <button onclick="joinGame()" class="nav-toggle">LIITU MÄNGUGA</button>
                </div>
                <div id="status-msg" style="margin-top:15px; color: #0f4; font-size: 0.8rem;"></div>
                <div id="player-list-lobby" style="margin-top:10px;"></div>
            </div>
            <button class="btn-massive" id="start-btn" onclick="startGame()" style="display:none; margin-top:20px;">ALUSTA MISSIOONI</button>
        </div>
    </section>

    <section id="player-controller" style="display:none; text-align:center; padding: 50px 20px;">
        <div class="home-ui" style="position: static; transform: none; width: 90%; margin: 0 auto;">
            <h2 id="controller-status">OOTA KÄSKLUSI...</h2>
            <div id="remote-vote-btns" class="voting-zone" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
                </div>
        </div>
    </section>

    <main id="game-interface" style="display:none">
        <nav class="command-panel">
            <div class="nav-btn-group">
                <div id="room-info" style="color: #0f4; border: 1px solid #333; padding: 5px 15px;">ONLINE SESSION ACTIVE</div>
                <button onclick="endGame()" class="btn-end-mission">LÕPETA MISSIOON</button>
            </div>
        </nav>

        <div class="tabletop">
            <div id="folder" class="folder-closed" onclick="openFolder()">
                <div class="folder-front">
                    <div class="folder-tab">FILE_ONLINE</div>
                    <div class="folder-cover-content">
                        <div class="stamp-red">LIVE FEED</div>
                        <h2>OPERATSIOONI TOIMIK</h2>
                        <p class="blink-text">[ VAJUTA AVAMISEKS ]</p>
                    </div>
                </div>
                <div class="folder-inside">
                    <div class="paper-page">
                        <div class="page-grid">
                            <div class="content-left">
                                <div class="report-meta">RAPORT #<span id="card-num">01</span></div>
                                <div class="question-area"><p id="task-text">Ootame andmeid...</p></div>
                                <button class="btn-confirm-heavy" onclick="nextCard()"><span class="btn-inner">JÄRGMINE KÜSIMUS</span></button>
                            </div>
                            <div class="content-right">
                                <div class="photo-box"><img id="task-img" src="war.jpg"></div>
                                <div class="stat-box"><div id="score-display"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <section id="debrief-screen" style="display: none;">
        <div class="tabletop">
            <div id="final-folder" class="folder-closed" onclick="openFinalFolder()">
                <div class="folder-front">
                    <h2>MISSIOONI LÕPP</h2>
                </div>
                <div class="folder-inside">
                    <div class="paper-page">
                        <h1>VÕITJA:</h1>
                        <div id="winner-announcement" class="winner-name"></div>
                        <div id="final-leaderboard" class="final-stats-box"></div>
                        <button class="btn-confirm-heavy" onclick="location.reload()" style="margin-top:20px;">
                            <span class="btn-inner">SULE JA VÄLJU</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
